meta:
  callsign: "DEKPR"
  icao_type: "PA28"
  model: "Piper PA-28 Archer II"
  revision: "Rev 3 | 2026-10-21"
  columns: 6
  font: dejavu-condensed
  scale: 1
  line_spacing: 1.35
  fold_margin_mm: 8
  col_gap_mm: 3
  outer_margin_mm: 8
normal:
  - col: 1
    sections:
      - title: COCKPIT PREPARATION
        items:
          - PIC: ESTEBLISHED
          - Preflight Inspection: COMPLETED
          - Pitot Cover: REMOVED
          - Mass & Balance: CHECKED
          - Documents & Papers: ON BOARD
          - Emergency Equipment: CHECKED
          - Master Switch (ALT & BAT): 'OFF'
          - Tach / Hobbs: NOTED
          - Circut Breakers: CHECKED IN
          - Seat Belts: FASTENED
          - SkyDemon: FLY
            style: blue
          - SkyEcho: ON / GREEN
            style: blue
      - title: BEFORE START
        items:
          - Fuel Selector: RIGHT TANK
            style: blue
          - MOGAS STC: CALLOUT
            style: note
          - Battery: 'ON'
          - Beacon Lt.: 'ON'
          - Parking Brake: AS REQ.
          - Electric Fuel Pump A: OPERATES
          - Electric Fuel Pump B: OPERATES
          - Monitor Fuel press.: CALLOUT
            style: note
      - title: ENGINE START
        header_color: blue
        items:
          - Mixture: FULL RICH
          - Electric Fuel Pump: ON (A or B)
            style: blue
          - Carb Heat: 'OFF'
          - Cold Engine: CALLOUT
            style: centered_blue
          - Throttle: ¼" OPEN
          - Prime: 3 TIMES
          - Hot Engine: CALLOUT
            style: centered_blue
          - Throttle: ½" OPEN
          - Cont.: CALLOUT
            style: centered_blue
          - Prop Area: CLEAR
          - Starter: ENGAGE
            style: blue
          - Throttle: 1000 RPM
          - Oil Pressure: CHECK
          - Engine Instruments: CHECK
          - Alternator: 'ON'
          - Annunciators: 'OFF'
          - SkyDemon: LOG ENGINE START
          - Electric Fuel Pump: OFF (MIDDLE)
      - title: AFTER START
        items:
          - Nav Lights: AS REQ.
          - Avionics: 'ON'
          - Radios: SET
          - Transponder: STBY
          - Circuit Breakers: IN
          - Fuel Qty: CHECK
          - Mixture: LEAN FOR TAXI
      - title: TAXI
        items:
          - Toe Brakes: CHECK
          - Gyro Compass: CHECK
  - col: 2
    sections:
      - title: RUN UP
        header_color: blue
        items:
          - Brakes: SET
          - Mixture: FULL RICH
          - Throttle: 2000 RPM
            style: blue
          - Engine Instruments: IN LIMITS
          - Magnetos (L–BOTH–R–BOTH): CHECK
            style: blue
          - Annunciators: TEST
          - Carb Heat: CHECK
            style: blue
          - Gyro Suction: IN LIMITS
          - Throttle: IDLE
          - Oil Press. & Temp.: IN LIMITS
          - Throttle: 1000 RPM
      - title: BEFORE TAKE OFF
        items:
          - Flight Controls: CHECK
          - Fuel Caps: CHECK L & R
          - Flight Instruments: SET
          - Radios: SET
          - Gyro Instruments: SET
          - Altimeter: SET
          - Flaps: AS REQ.
          - Electric Trim: SET
          - Trim: SET T/O
          - T/O & Emer. Briefing: COMPLETE
          - Doors & Windows: SECURED
          - Fuel Pump: ON (A OR B)
            style: blue
          - Fuel Selector: RIGHT TANK
          - ACL: 'ON'
          - Landing Light: 'ON'
          - Transponder: ALTITUDE
          - T/O Time: NOTED
          - Parking Brake: RELEASED
      - title: OPERATING SPEEDS [KIAS]
        type: speeds
        body_bg: true
        items:
          - Vr: 45–55
          - Vx: 64
          - Vy: 76
          - Climb: 88
          - Vs: 50
          - Vs0: 44
          - Va: 89–113
          - Vfe: 102
          - Vbo: 125
          - style: red
            Vne: 154
          - GLIDE: 76
            style: red
          - Max X-Wind: 17kn
  - col: 3
    sections:
      - title: AFTER TAKE OFF
        header_color: green
        items:
          - Flaps: UP
          - Landing Light: 'OFF'
          - Electric Fuel Pump: OFF (MIDDLE)
      - title: CRUISE
        header_color: green
        items:
          - Throttle: SET RPM
          - Mixture: LEANED
          - Fuel Balance: MAINTAINED
          - MOGAS STC: CALLOUT
            style: centered_blue
          - style: note
            'Vapor formation is more likely when operating ': CALLOUT
          - at ambient temperatures of 30C or above.: CALLOUT
            style: note
          - Additional vapor margin is provided from the: CALLOUT
            style: note
          - right tank due to its larger fuel supply: CALLOUT
            style: note
          - line, and when the fuel quantity in the: CALLOUT
            style: note
          - right tank is maintained at or above the full: CALLOUT
            style: note
          - indication.: CALLOUT
            style: note
          - Plan flight so as to have tank or more fuel: CALLOUT
            style: note
          - remaining in the right tank for landing and: CALLOUT
            style: note
          - possible go-around.: CALLOUT
            style: note
      - title: APPROACH
        header_color: green
        items:
          - Flight Instruments: CHECK & SET
          - Radios: SET
          - Landing Light: 'ON'
          - Fuel Pump: ON (A OR B)
            style: blue
          - Mixture: FULL RICH
          - Fuel Selector: RIGHT TANK
          - style: note
            'Use LH Tank if RH Tank Fuel Qty less then ¼ ': CALLOUT
          - Approach Briefing: COMPLETE
          - Seat Belts: FASTENED
          - Carb Heat: AS REQ.
      - title: AFTER LANDING
        header_color: yellow
        items:
          - Transponder: STBY
          - Landing Light: 'OFF'
          - ACL: 'OFF'
          - Mixture: LEANED
          - Flaps: UP
          - Time: NOTED
          - Carb Heat: 'OFF'
          - Electric Fuel Pump: OFF (MIDDLE)
      - title: PARKING
        header_color: yellow
        items:
          - Fuel Pump: 'OFF'
          - Avionics: 'OFF'
          - Electric Trim: 'OFF'
          - Mixture: CUT OFF
          - Electrical Equipment: 'OFF'
          - Battery & Alternator: 'OFF'
          - Magnetos: 'OFF'
          - SkyDemon: LOG ENGINE STOP
          - Tach / Hobbs: NOTED
            style: blue
          - DZ Headset: TURN OFF
          - SkyEcho: TURN OFF
emergency:
  - col: 1
    sections:
      - title: ENGINE FAILURE
        items:
          - ALTITUDE SUFFICIENT FOR RESTART?: null
            style: centered_blue
          - NO →: null
            style: note
          - Glide: ESTABLISH
          - Landing Site: SELECT
          - Mixture: CUT OFF
          - Battery / Alternator: 'OFF'
          - Magnetos: 'OFF'
          - Fuel Selector: 'OFF'
          - YES →: null
            style: note
          - Glide: ESTABLISH
          - Landing Site: SELECT
          - Electric Fuel Pump: 'ON'
          - Mixture: FULL RICH
          - Fuel Selector: OPPOSITE TANK
          - Carb Heat: 'ON'
          - Throttle: SET
          - Primer: LOCKED
          - Magnetos: CHECK
          - — ENGINE RESTARTED? —: null
            style: centered
          - YES → Leave fuel selector on present tank: null
            style: note
          - style: note
            Land as soon as possible: null
          - NO → Mayday: TRANSMIT
            style: warn
          - NO → Mixture: CUT OFF
          - NO → Throttle: OPEN
          - NO → Electric Fuel Pump: 'OFF'
          - NO → Fuel Selector: 'OFF'
      - title: ENGINE ROUGHNESS
        items:
          - Carb Heat: 'ON'
          - style: note
            If roughness continues after 1 min: null
          - Carb Heat: 'OFF'
          - Mixture: ADJUST
          - Electric Fuel Pump: 'ON'
          - Fuel Selector: OPPOSITE TANK
          - Engine Instruments: CHECK
          - Magnetos: CHECK
          - style: note
            If one magneto OK — continue reduced power: null
          - style: note
            mixture rich, land ASAP: CALLOUT
      - title: CARBURETOR ICING
        items:
          - Carb Heat: 'ON'
          - Mixture: ADJUST
      - title: ENGINE FIRE — START
        items:
          - Starter: ENGAGE
          - Mixture: CUT OFF
          - Throttle: OPEN
          - Electric Fuel Pump: 'OFF'
          - Fuel Selector: 'OFF'
          - EVACUATE IF FIRE CONTINUES: null
            style: warn
      - title: ENGINE FIRE — TAXI
        items:
          - Airplane: STOP
          - Mixture: CUT OFF
          - Fuel Selector: 'OFF'
          - Battery / Alternator: 'OFF'
          - EVACUATE AIRCRAFT!: null
            style: warn
  - col: 2
    sections:
      - title: ENGINE FIRE — FLIGHT
        items:
          - Mixture: CUT OFF
          - Fuel Selector: 'OFF'
          - Glide: ESTABLISH
          - Landing Site: SELECT
          - Mayday: TRANSMIT
            style: warn
          - Magnetos: 'OFF'
          - Battery / Alternator: 'OFF'
      - title: CABIN FIRE (FLIGHT)
        items:
          - Battery / Alternator: 'OFF'
          - Electrical Equipment: 'OFF'
          - Vents: OPEN
      - title: ELECTRICAL FAILURE
        items:
          - Load Meter: VERIFY INOP
          - style: note
            If load meter = zero: null
          - Alternator: 'OFF'
          - Reduce electrical load to minimum: null
            style: note
          - Circuit Breakers: CHECK & RESET
          - Alternator: 'ON'
          - style: note
            If power not restored: null
          - Alternator: 'OFF'
          - LAND AS SOON AS PRACTICAL: null
            style: warn
      - title: ELECTRICAL OVERLOAD
        items:
          - Alternator: 'OFF'
          - Battery: 'ON'
          - Reduce electrical loads to minimum: null
            style: note
          - LAND AS SOON AS PRACTICAL: null
            style: warn
      - title: LOW FUEL PRESSURE
        items:
          - Electric Fuel Pump: ON (A OR B)
          - style: centered_blue
            SWITCH TO OTHER FUEL PUMP: CALLOUT
          - Fuel Selector: OPPOSITE TANK
      - title: SPIN RECOVERY
        items:
          - Throttle: IDLE
          - Ailerons: NEUTRAL
          - Rudder: OPPOSITE DIR OF ROTATION
          - Control Wheel: FORWARD
          - style: note
            Rudder + wheel neutral when rotation stops: null
          - Pitch: LEVEL
            style: blue
      - title: LOSS OF OIL PRESS. / HIGH OIL TEMP.
        items:
          - LAND AS SOON AS PRACTICAL: null
            style: warn
          - style: red
            Prepare for engine loss: null
      - title: FLOODED ENGINE START
        items:
          - Throttle: ½" OPEN
          - Battery / Alternator: 'ON'
          - Electric Fuel Pump: 'OFF'
          - Mixture: CUT OFF
          - Starter: ENGAGE
          - Mixture (when engine fires): FULL RICH
          - Throttle: 1000 RPM
          - Oil Pressure: CHECK
preflight:
  - col: 1
    sections:
      - title: ① COCKPIT
        items:
          - Parking Brakes: SET
          - Hobbs / Tach: CHECK
          - Battery: 'ON'
          - Fuel Quantity: CHECK
          - Lights / Stall Warning: CHECK
          - Electrical Equipment: 'OFF'
          - Battery: 'OFF'
          - Flaps: CHECK / UP
          - Electric Trim: CHECK OFF
          - Trim: CHECK
          - Pitot / Static / Drains: DRAIN / CLOSE
          - Acft Documents: ON BOARD
          - Pilot Documents: ON BOARD
        header_color: yellow
      - title: ② RIGHT WING
        header_color: yellow
        items:
          - Flap Hinges: CHECK
          - Aileron: CHECK HINGES
          - Wingtip / Lights: CHECK
          - Leading Edge: CLEAN
          - Fuel Quantity: CHECK TANK
          - Fuel Vent: CLEAR
          - Fuel Strainer: SAMPLE
          - LDG / Tyre: CHECK
          - Air Inlet: CLEAR
      - title: ③ NOSE
        header_color: yellow
        items:
          - Engine Condition: CHECK
          - Oil Quantity: CHECK
          - Prop & Spinner: CHECK
          - Alternator Belt: CHECK
          - Air Inlets: CLEAR
          - Landing Light: CHECK
          - Nose Gear & Tyre: CHECK
          - Fuel Strainer: SAMPLE
      - title: ④ LEFT WING
        header_color: yellow
        items:
          - Flap Hinges: CHECK
          - Aileron: CHECK HINGES
          - Wingtip / Lights: CHECK
          - Leading Edge: CLEAN
          - Fuel Quantity: CHECK
          - Fuel Vent: CLEAR
          - Fuel Strainer: SAMPLE
          - LDG / Tyre: CHECK
          - Air Inlet: CLEAR
          - Pitot / Static Port: CHECK
          - Stall Warning Horn: CHECK
      - title: ⑤ FUSELAGE & EMPENNAGE
        header_color: yellow
        items:
          - Antennas: CHECK
          - Air Inlet: CHECK
          - Stabilator & Trim: CHECK
          - Rudder: CHECK
